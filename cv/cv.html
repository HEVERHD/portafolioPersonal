<!doctype html>
<!--
  Hoja de vida de Hevert Gelis. Plantilla de los PDF en public/cv/; los datos salen del portafolio
  (src/content.ts y src/roles.ts) a través de cv/data.mjs.
  Regenerar con: npm run cv   (crea cv/cv-data.js y los PDF)
  ?cv=EN, ?cv=ES-VTEX… muestra cada versión.
-->
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Hevert Gelis · CV</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink: #14141c; --muted: #5b5b6e; --line: #e4e4ec; --accent: #5b4ce0; --neon: #0a8fc4; --side: #f4f4f9; }
  html, body { font-family: Inter, system-ui, sans-serif; color: var(--ink); font-size: 9.6pt; line-height: 1.45; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  a { color: inherit; text-decoration: none; }
  /* Two A4 pages tall so the sidebar background runs down both */
  .page { display: grid; grid-template-columns: 66mm 1fr; min-height: 594mm; }
  aside { background: var(--side); padding: 11mm 7mm 10mm 9mm; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .keep { break-inside: avoid; }
  /* clone repeats the top/bottom padding on every printed page */
  main { padding: 13mm 11mm 10mm 10mm; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .photo { width: 30mm; height: 30mm; border-radius: 50%; object-fit: cover; object-position: 50% 18%; border: 2.5px solid #fff; box-shadow: 0 0 0 1.5px var(--accent); margin-bottom: 5mm; }
  h1 { font-family: "Space Grotesk", sans-serif; font-size: 23pt; line-height: 1.05; letter-spacing: -0.5px; }
  .role { font-family: "Space Grotesk", sans-serif; font-weight: 500; font-size: 11pt; color: var(--accent); margin-top: 2mm; }
  .summary { margin-top: 4.5mm; color: #2c2c38; }
  h2 { font-family: "Space Grotesk", sans-serif; font-size: 9pt; letter-spacing: 1.6px; text-transform: uppercase; color: var(--neon); margin: 7mm 0 2.8mm; padding-bottom: 1.5mm; border-bottom: 1px solid var(--line); }
  aside h2 { border-color: #dcdce6; margin-top: 5mm; }
  aside h2:first-of-type { margin-top: 0; }
  .contact li { list-style: none; margin-bottom: 1.2mm; word-break: break-word; }
  .contact span { display: block; font-size: 7.4pt; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .skill { margin-bottom: 2mm; break-inside: avoid; }
  .skill b { display: block; font-weight: 600; font-size: 8.8pt; }
  .skill p { color: #33333f; font-size: 8.8pt; }
  .edu { margin-bottom: 2mm; break-inside: avoid; }
  .edu b { display: block; font-weight: 600; font-size: 8.8pt; }
  .edu p { color: var(--muted); font-size: 8.4pt; }
  /* Long roles may continue on the next page, but never split a bullet or the role header */
  .job { margin-bottom: 4.2mm; }
  .job li, .job-head, .org { break-inside: avoid; }
  .job-head { break-after: avoid; }
  .job-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4mm; }
  .job-head h3 { font-size: 10.6pt; font-weight: 600; }
  .dates { font-size: 8.2pt; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .org { color: var(--accent); font-weight: 500; font-size: 9pt; margin: 0.4mm 0 1.4mm; }
  .job ul { padding-left: 4mm; }
  .job li { margin-bottom: 0.9mm; }
  .job li::marker { color: var(--accent); }
  .app { display: inline-block; font-size: 7.8pt; font-weight: 500; color: var(--neon); margin-top: 0.6mm; }
  .projects { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4mm 5mm; }
  .project { break-inside: avoid; }
  .project b { font-weight: 600; }
  .project p { color: #33333f; font-size: 8.8pt; }
  .project a { font-size: 7.8pt; color: var(--neon); }
  .certs { display: grid; gap: 1.2mm; font-size: 8.8pt; }
  .certs span { color: var(--muted); }
  .no-photo .photo { display: none; }
</style>
</head>
<body>
<div class="page" id="cv"></div>

<!-- Generated by cv/build.mjs from src/content.ts and src/roles.ts (not committed) -->
<script src="cv-data.js"></script>
<script>
// ?cv=ES (default), EN, ES-VTEX, EN-VTEX… picks one of the CVs in cv-data.js
const params = new URLSearchParams(location.search);
const c = window.CV_DATA[(params.get("cv") ?? "ES").toUpperCase()] ?? window.CV_DATA.ES;
const L = c.labels;
document.documentElement.lang = c.htmlLang;
if (!c.photo) document.body.classList.add("no-photo");

const link = (href, text) => `<a href="${href}">${text}</a>`;
// "https://www.linkedin.com/in/x/" → "linkedin.com/in/x"
const short = (url) => url.replace(/^https:\/\/(www\.)?/, "").replace(/\/$/, "");
document.getElementById("cv").innerHTML = `
  <aside>
    <img class="photo" src="../public/hevert-pro.jpg" alt="Hevert Gelis" />
    <h2>${L.contact}</h2>
    <ul class="contact">
      <li><span>${L.phone}</span>${link(c.contact.whatsapp, c.contact.phone)}</li>
      <li><span>${L.email}</span>${link("mailto:" + c.contact.email, c.contact.email)}</li>
      <li><span>${L.location}</span>${c.location}</li>
      <li><span>${L.web}</span>${link(c.contact.site, short(c.contact.site))}</li>
      <li><span>LinkedIn</span>${link(c.contact.linkedin, short(c.contact.linkedin))}</li>
      <li><span>GitHub</span>${link(c.contact.github, short(c.contact.github))}</li>
    </ul>
    <h2>${L.skills}</h2>
    ${c.skills.map(([k, v]) => `<div class="skill"><b>${k}</b><p>${v}</p></div>`).join("")}
    <div class="keep">
      <h2>${L.education}</h2>
      ${c.education.map(([k, v]) => `<div class="edu"><b>${k}</b><p>${v}</p></div>`).join("")}
    </div>
    <div class="keep">
      <h2>${L.languages}</h2>
      ${c.languages.map(([k, v]) => `<div class="edu"><b>${k}</b><p>${v}</p></div>`).join("")}
    </div>
  </aside>
  <main>
    <h1>Hevert David<br />Gelis Díaz</h1>
    <p class="role">${c.role}</p>
    <p class="summary">${c.summary}</p>
    <h2>${L.experience}</h2>
    ${c.jobs.map((j) => `
      <section class="job">
        <div class="job-head"><h3>${j.role}</h3><span class="dates">${j.dates}</span></div>
        <p class="org">${j.org}</p>
        <ul>${j.points.map((p) => `<li>${p}</li>`).join("")}</ul>
        ${j.app ? `<span class="app">↗ ${j.app}</span>` : ""}
      </section>`).join("")}
    <h2>${L.projects}</h2>
    <div class="projects">
      ${c.projects.map(([n, d, u]) => `<div class="project"><b>${n}</b><p>${d}</p>${u ? link("https://" + u, u) : ""}</div>`).join("")}
    </div>
    <h2>${L.certs}</h2>
    <div class="certs">${c.certs.map(([n, s]) => `<div>${n} <span>· ${s}</span></div>`).join("")}</div>
  </main>`;
</script>
</body>
</html>
